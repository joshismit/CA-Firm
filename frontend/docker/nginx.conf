# ─────────────────────────────────────────────────────────────────────────────
# CA Firm ERP — Frontend Nginx config
# ─────────────────────────────────────────────────────────────────────────────
# Listens on 8080 (not 80) so the container can run as a non-root user —
# binding <1024 requires root. Port is mapped back to 80/443 at the
# docker-compose / reverse-proxy layer.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml
        font/woff2;

    # Security headers — mirrors the backend's helmet() defaults for the
    # static asset origin (see backend/src/app.ts).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed build assets (Vite appends a content hash to every filename) —
    # safe to cache for a year; a new deploy ships new filenames, never
    # mutates an existing one.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html itself must never be cached — it's what references the
    # hashed asset filenames, so a stale copy would point at assets that no
    # longer exist after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — any path that isn't a real static file resolves to
    # index.html so React Router can handle client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
